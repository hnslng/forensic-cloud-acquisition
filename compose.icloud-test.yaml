name: fca-icloud-adapter-check
services:
  adapter-test:
    image: fca-lab-icloud-adapter-test:local
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: icloud-adapter-test
    user: '10001:10001'
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 64
