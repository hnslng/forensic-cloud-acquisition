# Phase 0: infrastructure smoke test only. No application or public ports.
name: fca-lab
services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: fca
      POSTGRES_USER: fca_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${FCA_STATE_ROOT:?Set external FCA_STATE_ROOT}/postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.75
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  database:
    internal: true
secrets:
  postgres_password:
    file: ${FCA_POSTGRES_PASSWORD_FILE:?Set external FCA_POSTGRES_PASSWORD_FILE}
