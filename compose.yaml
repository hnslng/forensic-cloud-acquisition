# Application API is loopback-only behind the guest's HTTPS reverse proxy.
name: fca-lab
services:
  database:
    image: postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    restart: unless-stopped
    environment:
      POSTGRES_DB: fca
      POSTGRES_USER: fca_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${FCA_STATE_ROOT:?Set external FCA_STATE_ROOT}/postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.75
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    profiles: [application]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: runtime
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      FCA_DB_PASSWORD_FILE: /run/secrets/api_password
      FCA_PUBLIC_ORIGIN: ${FCA_PUBLIC_ORIGIN:?Set HTTPS origin}
      FCA_EVIDENCE_ROOT: /evidence
    secrets: [api_password]
    volumes:
      - ${FCA_EVIDENCE_ROOT:?Set external evidence mount}:/evidence:ro
    ports:
      - 127.0.0.1:8000:8000
    networks: [database, web]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health",timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 96
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  web:
    driver: bridge
  database:
    internal: true
secrets:
  postgres_password:
    file: ${FCA_POSTGRES_PASSWORD_FILE:?Set external FCA_POSTGRES_PASSWORD_FILE}
  api_password:
    file: ${FCA_API_PASSWORD_FILE:?Set external API secret file}
